[project]
name = "rai_framework"
version = "1.0.0"
description = "RAI is a framework for building general multi-agent systems, bringing Gen AI features to ROS enabled robots."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Maciej Majek", email = "maciej.majek@robotec.ai" },
    { name = "Bartlomiej Boczek", email = "bartlomiej.boczek@robotec.ai" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "rai_core",
    "rai_whoami",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
    "tabulate>=0.10.0,<0.11.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "mkdocstrings-python",
    "mkdocs-markdownextradata-plugin",
    "mkdocs-callouts",
]
s2s = ["rai_s2s[all]"]
semap = ["rai_semap"]
simbench = ["rai_sim", "rai_bench"]
perception = ["rai_perception"]

[tool.uv]
package = false
# rclpy and the other ROS 2 Python packages are built for the system interpreter.
# The venv must use it and see its site-packages: `uv venv --system-site-packages`.
python-preference = "only-system"
environments = ["sys_platform == 'linux'"]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "src/rai_core",
    "src/rai_whoami",
    "src/rai_s2s",
    "src/rai_semap",
    "src/rai_sim",
    "src/rai_bench",
    "src/rai_extensions/rai_perception",
]

[tool.uv.sources]
rai_core = { workspace = true }
rai_whoami = { workspace = true }
rai_s2s = { workspace = true }
rai_semap = { workspace = true }
rai_sim = { workspace = true }
rai_bench = { workspace = true }
rai_perception = { workspace = true }

[tool.ruff]
# Python snippets in docs are not formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Keep the rule set that ruff used by default before 0.15; pre-commit extends it with I and RUF022.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
# Workspace packages live in src/<name>/<name>, which newer ruff no longer resolves as first-party on its own.
known-first-party = [
    "rai_bench",
    "rai_bringup",
    "rai_core",
    "rai_extensions",
    "rai_finetune",
    "rai_interfaces",
    "rai_s2s",
    "rai_semap",
    "rai_sim",
    "rai_whoami",
]

[tool.pytest.ini_options]
markers = [
    "billable: marks test as billable  (deselect with '-m \"not billable\"')",
    "ci_only: marks test as cli only (deselect with '-m \"not ci_only\"')",
    "manual: marks tests as manual (may require demo app to be running, deselect with '-m \"manual\")",
]
# ROS 2 (Jazzy and Lyrical) auto-loads launch_testing pytest plugins that are incompatible with pytest 9.
# RAI does not use launch tests, so they are disabled.
addopts = "-m 'not billable and not ci_only and not manual' --ignore=src -p no:launch_testing -p no:launch_ros"
log_cli = true
log_cli_level = "INFO"
