name: Pre-commit Checks

on:
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04

    # The hooks need no ROS, so this runs on the plain runner rather than in a ROS
    # container (no container apt step, no multi-GB image pull).
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The gruntwork shellcheck hook needs the shellcheck binary. The runner image
      # ships it; install it only if that ever changes.
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: "--all-files"
