name: build and test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - development
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test-ros2:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-24.04

    continue-on-error: true
    timeout-minutes: 45

    strategy:
      matrix:
        ros_distro:
          - jazzy

    container:
      image: osrf/ros:${{ matrix.ros_distro }}-desktop-full

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Create virtual audio device
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get --yes install jackd
          jackd -d dummy -r 44100 &

      # CPU-only torch: the CUDA build does not fit on a GitHub-hosted runner.
      # --no-deps keeps the exact versions from uv.lock.
      - name: Install python dependencies
        shell: bash
        run: |
          uv export --all-groups --frozen --no-hashes | grep -vE '^(nvidia-|triton==)' > /tmp/requirements-cpu.txt
          uv venv --python /usr/bin/python3
          uv pip install --no-deps --torch-backend cpu -r /tmp/requirements-cpu.txt

      - name: Update rosdep
        shell: bash
        run: |
          rosdep update

      - name: Import ros2 dependencies
        shell: bash
        run: |
          vcs import . < ros_deps.repos

      - name: Install ROS 2 package dependencies
        shell: bash
        run: |
          apt-get update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build the workspace
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build

      - name: Run tests
        shell: bash
        run: |
          source setup_shell.sh
          pytest -m "not billable and not manual" --timeout=120 --timeout-method=thread --cov=./src/rai_core --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ matrix.ros_distro == 'jazzy' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          name: codecov-pytest
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.ros_distro == 'jazzy' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
