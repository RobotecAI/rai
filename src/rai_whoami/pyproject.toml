[project]
name = "rai_whoami"
version = "0.2.0"
description = "Package to extract embodiment information from robot documentation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Maciej Majek", email = "maciej.majek@robotec.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "PyYAML",
    "langchain>=1.0.0,<2.0.0",
    "langchain-community",
    "Pillow",
    "faiss-cpu",
    "pypdf>=6.21.4,<8.0.0",
]

[project.scripts]
build-whoami = "rai_whoami.build_whoami:main"
initialize-docs = "rai_whoami.initialize_docs_directory:main"

[tool.uv.build-backend]
module-root = ""
module-name = "rai_whoami"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
