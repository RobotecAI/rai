[project]
name = "rai-bench"
version = "1.0.0"
description = "Package for running and creating benchmarks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
    { name = "Jakub Matejczyk", email = "jakub.matejczyk@robotec.ai" },
    { name = "Magdalena Kotynia", email = "magdalena.kotynia@robotec.ai" },
]
dependencies = [
    "inflect>=7.5.0,<8.0.0",
    "plotly>=6.0.1,<8.0.0",
    "rai_core[langfuse,ui]>=3.0.0,<4",
    "rai_perception>=1.0.0,<2",
    "rai_sim>=1.0.0,<2",
]

[tool.uv.build-backend]
module-root = ""
module-name = "rai_bench"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
