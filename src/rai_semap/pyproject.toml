[project]
name = "rai_semap"
version = "1.0.0"
description = "Semantic mapping and spatial memory for RAI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Julia Jia" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "rai_core>=3.0.0,<4",
    "rai_perception>=1.0.0,<2",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10.0.0"]

[tool.uv.sources]
rai_core = { workspace = true }
rai_perception = { workspace = true }

[tool.uv.build-backend]
module-root = ""
module-name = "rai_semap"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
