[project]
name = "rai_s2s"
version = "1.2.0"
description = "Speech-to-Speech module for RAI framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kajetan Rachwal", email = "kajetan.rachwal@robotec.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "sounddevice>=0.5.0,<0.6.0",
    "scipy>=1.14.0,<2.0.0",
    "pydub>=0.25.1,<0.26.0",
    "torchaudio>=2.11.0,<3.0.0",
    "onnxruntime>=1.24,<2.0; platform_machine == 'x86_64'",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.4.1,<2.0.0"]
whisper = ["openai-whisper>=20250625,<20250626"]
fasterwhisper = ["faster-whisper>=1.1.1,<2.0.0"]
wakeword = ["openwakeword @ git+https://github.com/maciejmajek/openWakeWord.git@f2340d82a39fe7bfb972c8c4114642fa87e5dc59"]
kokoro = ["kokoro-onnx==0.3.3"]
gpu = [
    "onnxruntime-gpu>=1.24,<2.0; platform_machine == 'x86_64'",
]
all = [
    "elevenlabs>=1.4.1,<2.0.0",
    "openai-whisper>=20250625,<20250626",
    "faster-whisper>=1.1.1,<2.0.0",
    "openwakeword @ git+https://github.com/maciejmajek/openWakeWord.git@f2340d82a39fe7bfb972c8c4114642fa87e5dc59",
    "onnxruntime-gpu>=1.24,<2.0; platform_machine == 'x86_64'",
]

[tool.uv.build-backend]
module-root = ""
module-name = "rai_s2s"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
