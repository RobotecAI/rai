[project]
name = "rai-sim"
version = "0.0.2"
description = "Package to run simulations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Jakub Matejczyk", email = "jakub.matejczyk@robotec.ai" },
    { name = "Magdalena Kotynia", email = "magdalena.kotynia@robotec.ai" },
    { name = "Kacper Dabrowski", email = "kacper.dabrowski@robotec.ai" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "PyYAML",
    "rai_core>=2.0.0a2,<3.0.0",
]

[tool.uv.build-backend]
module-root = ""
module-name = "rai_sim"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
