[project]
name = "rai-perception"
# TODO, update the version once it is published to PyPi
version = "0.4.0"
description = "Package for object detection, segmentation and gripping point detection."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Maciej Majek", email = "maciej.majek@robotec.ai" },
    { name = "Julia Jia", email = "juliajster@gmail.com" },
    { name = "Kajetan Rachwal", email = "kajetan.rachwal@robotec.ai" },
]
dependencies = [
    "torch>=2.11.0,<3.0.0",
    "torchvision>=0.26.0,<1.0.0",
    "rai-gsam2>=1.1.2,<2.0.0",
    "rai_core>=2.0.0a2,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    # Grounding DINO runs on the transformers implementation (AutoModelForZeroShotObjectDetection).
    "transformers>=5.10.0,<6.0.0",
    "huggingface-hub>=1.0.0,<3.0.0",
]

[project.scripts]
download-perception-models = "rai_perception.scripts.download_weights:main"

[tool.hatch.build.targets.wheel]
packages = ["rai_perception"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
