[project]
name = "rai_core"
version = "2.15.0"
description = "Core functionality for RAI framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Maciej Majek", email = "maciej.majek@robotec.ai" },
    { name = "Bartlomiej Boczek", email = "bartlomiej.boczek@robotec.ai" },
    { name = "Kajetan Rachwal", email = "kajetan.rachwal@robotec.ai" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "langchain-core>=1.7.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-prebuilt",
    "langchain>=1.4.0,<2.0.0",
    "langchain-aws",
    "langchain-openai",
    "langchain-ollama",
    "langchain-google-genai",
    "langchain-mistralai",
    "langchain-community",
    "requests>=2.33.0,<3.0.0",
    "coloredlogs>=15.0.1,<16.0.0",
    "tqdm>=4.66.4,<5.0.0",
    "deprecated>=1.2.14,<2.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.1.0,<2.0.0",
    # 4.10.0.84 is the first opencv-python build that imports under numpy 2.
    "opencv-python>=4.10.0.84,<6.0.0.0",
    "opencv-python-headless>=4.10.0.84,<6.0.0.0",
    "lark>=1.1.9,<2.0.0",
    "transforms3d>=0.4.1,<0.5.0",
    "pillow>=13.0.0,<14.0.0",
    "langfuse>=4.0.0,<5.0.0",
    "pydub>=0.25.1,<0.26.0",
    "streamlit>=1.67,<2.0.0",
    # numpy 2 only. Images are converted by rai.communication.ros2.image_bridge, not by
    # the apt cv_bridge, whose compiled helper only works with numpy 1.x and segfaults
    # under numpy 2.
    "numpy>=2.0.0,<3.0.0",
]

[project.scripts]
rai-config-init = "rai.initialization.config_initialization:main"

[tool.uv.build-backend]
module-root = ""
module-name = "rai"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
