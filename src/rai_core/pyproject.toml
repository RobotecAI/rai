[project]
name = "rai_core"
version = "2.14.1"
description = "Core functionality for RAI framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Maciej Majek", email = "maciej.majek@robotec.ai" },
    { name = "Bartlomiej Boczek", email = "bartlomiej.boczek@robotec.ai" },
    { name = "Kajetan Rachwal", email = "kajetan.rachwal@robotec.ai" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "langchain-core>=1.7.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-prebuilt",
    "langchain>=1.4.0,<2.0.0",
    "langsmith>=0.4.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "typing-extensions>=4.5.0",
    "requests>=2.33.0,<3.0.0",
    "opencv-python-headless>=5.0.0.93,<6.0.0.0",
    "pillow>=13.0.0,<14.0.0",
    "numpy>=2.0,<3.0",
]

[project.scripts]
rai = "rai.cli:main"

[project.optional-dependencies]
openai = ["langchain-openai>=1.0.0,<2.0.0"]
anthropic = ["langchain-anthropic>=1.0.0,<2.0.0"]
aws = ["langchain-aws>=1.0.0,<2.0.0"]
google = ["langchain-google-genai>=4.0.0,<5.0.0"]
ollama = ["langchain-ollama>=1.0.0,<2.0.0"]
langfuse = ["langfuse>=5.0.0,<6.0.0"]
mcp = ["mcp>=1.20.0,<2.0.0", "langchain-mcp-adapters>=0.3.0,<1.0.0"]
ui = ["streamlit>=1.67,<2.0.0", "tomli-w>=1.1.0,<2.0.0"]
all = ["rai_core[openai,anthropic,aws,google,ollama,langfuse,mcp,ui]"]

[tool.uv.build-backend]
module-root = ""
module-name = "rai"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
